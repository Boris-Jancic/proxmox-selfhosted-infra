---
all:
  children:
    # Cluster `skylab`. Every guest below carries `pve_node` (default:
    # proxmox_node, i.e. pve-brain) naming the node it lives on; each node
    # entry carries its own name so guests can be mapped to an SSH target.
    proxmox_nodes:
      vars:
        ansible_user: root
      hosts:
        # Label kept as `pve` (referenced by homepage + older plays).
        pve:
          ansible_host: 192.168.88.10
          pve_node: pve-brain
          proxmox_domain: bong
        pve-worker:
          ansible_host: 192.168.88.20
          pve_node: pve-worker
          proxmox_domain: home.arpa

    # External quorum vote for the two-node cluster (roles/qdevice). Must be an
    # always-on Debian/Ubuntu box outside the cluster, e.g.:
    #   qdevice-pi:
    #     ansible_host: 192.168.88.5
    qdevice:
      vars:
        ansible_user: root
      hosts: {}

    virtual_machines:
      vars:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3

      hosts:
        ubuntu-vm1:
          id: 110
          ansible_host: 192.168.88.110
          memory: 6196
          disk: 512
          cores: 3
          description: |
            # ubuntu-vm1
            Virtual machine that hosts following workloads:
              - portainer
              - nextcloudAIO
              - nextjs-blog (Portainer stack, silo object storage)
              - GitHub Actions runner

            Do not edit manually.
          # Runs untrusted CI jobs: no path to the node GUIs/SSH.
          firewall_out:
            - { dest: +pve_nodes, comment: runner must not reach the nodes }
          firewall_in:
            # Portainer is LAN-only: no Caddy route, no tunnel hostname.
            - { dport: "9000,9443", source: lan, comment: portainer }
            - { dport: 11000, source: [caddy, +monitors, +management], comment: nextcloud }
            - { dport: 3000, source: [caddy, +management], comment: blog }
            - { dport: "8080,8443", source: +management, comment: nextcloud aio admin }

        ubuntu-vm2-cks-master:
          id: 120
          ansible_host: 192.168.88.120
          pve_node: pve-worker
          vm_storage: local-lvm
          memory: 2560
          disk: 50
          # kubeadm preflight requires >= 2 CPUs.
          cores: 2
          description: |
            # ubuntu-vm2-cks-master
            Virtual machine that hosts following workloads:
              - k8s master node

            Do not edit manually.
        ubuntu-vm3-cks-worker:
          id: 130
          ansible_host: 192.168.88.130
          pve_node: pve-worker
          vm_storage: local-lvm
          memory: 2560
          disk: 50
          cores: 2
          description: |
            # ubuntu-vm3-cks-worker
            Virtual machine that hosts following workloads:
              - k8s worker node

            Do not edit manually.

    lxc_containers:
      vars:
        ansible_user: root

      hosts:
        pi-hole:
          ctid: 101
          ansible_host: 192.168.88.101
          memory: 256
          disk: 4
          cores: 1
          description: |
            # LXC - Pi-Hole
            Active DNS query blocking

            Do not edit manually.
          firewall_in:
            - { macro: DNS, comment: any client }
            - { dport: 80, source: [caddy, +monitors, +management], comment: admin ui + api }

        vaultwarden:
          ctid: 102
          ansible_host: 192.168.88.102
          pve_node: pve-worker
          memory: 256
          disk: 4
          cores: 1
          description: |
            # LXC - VaultWarden
            Manages passwords

            Do not edit manually.
          firewall_in:
            - { dport: 8080, source: [caddy, +monitors, +management] }
          # Hosts docker; provision-lxc.yml will set
          # `lxc.apparmor.profile: unconfined` on the CT.
          lxc_docker_host: true

        uptime-kuma:
          ctid: 103
          ansible_host: 192.168.88.103
          pve_node: pve-worker
          memory: 256
          disk: 12
          cores: 1
          firewall_in:
            - { dport: 3001, source: [caddy, +monitors, +management] }
          # Hosts docker; provision-lxc.yml will set
          # `lxc.apparmor.profile: unconfined` on the CT.
          lxc_docker_host: true

        homepage:
          ctid: 104
          ansible_host: 192.168.88.104
          pve_node: pve-worker
          memory: 256
          disk: 4
          cores: 1
          lxc_docker_host: true
          # Host header allow-list for homepage v0.10+. Include every name
          # the browser might send: LAN IP:port for direct access, plus the
          # public hostname when fronted by the Caddy reverse proxy.
          homepage_allowed_hosts: "homepage.{{ cloudflare_zone }},192.168.88.104:3000"
          firewall_in:
            - { dport: 3000, source: [caddy, +management] }

        caddy:
          ctid: 100
          ansible_host: 192.168.88.100
          memory: 256
          disk: 4
          cores: 1
          # cloudflared dials localhost; :80 from the LAN is for Homepage/Kuma checks.
          firewall_in:
            - { dport: 80, source: lan }
          caddy_routes:
            - name: proxmox
              domain: "proxmox.{{ cloudflare_zone }}"
              destination: https://192.168.88.10:8006

            - name: pihole
              domain: "pihole.{{ cloudflare_zone }}"
              destination: http://192.168.88.101:80
              redirect_root_to: /admin/

            - name: homepage
              domain: "homepage.{{ cloudflare_zone }}"
              destination: http://192.168.88.104:3000

            - name: kuma
              domain: "kuma.{{ cloudflare_zone }}"
              destination: http://192.168.88.103:3001

            - name: cloud
              domain: "cloud.{{ cloudflare_zone }}"
              destination: http://192.168.88.110:11000

            - name: blog
              domain: "blog.{{ cloudflare_zone }}"
              destination: http://192.168.88.110:3000

            - name: vaultwarden
              domain: "vaultwarden.{{ cloudflare_zone }}"
              destination: http://192.168.88.102:8080
