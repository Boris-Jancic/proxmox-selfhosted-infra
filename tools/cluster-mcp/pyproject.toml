[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-mcp"
version = "0.1.0"
description = "Read-only MCP server for the skylab Proxmox VE cluster"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "requests>=2.31",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cluster-mcp = "cluster_mcp.server:main"

[tool.setuptools]
packages = ["cluster_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["cluster_mcp"]
