---
- name: Check caddy binary
  stat:
    path: /usr/local/bin/caddy
  register: caddy_bin

- name: Download and extract caddy binary
  ansible.builtin.unarchive:
    src: "{{ caddy_binary_url }}"
    dest: /usr/local/bin
    remote_src: true
    include:
      - caddy
    mode: "0755"
  when: not caddy_bin.stat.exists

- name: Deploy caddy systemd unit
  template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable and start caddy
  systemd:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true
