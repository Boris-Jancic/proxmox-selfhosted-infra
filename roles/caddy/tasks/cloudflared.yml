---
- name: Check if cloudflared installed
  ansible.builtin.stat:
    path: /usr/bin/cloudflared
  register: cloudflared_bin

- name: Download cloudflared deb
  ansible.builtin.get_url:
    url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
    dest: /tmp/cloudflared.deb
    mode: "0644"
  when: not cloudflared_bin.stat.exists

- name: Install cloudflared
  ansible.builtin.apt:
    deb: /tmp/cloudflared.deb
  when: not cloudflared_bin.stat.exists

# `cloudflared service install <token>` bakes the token into the ExecStart line
# of the unit. Read it back so we can tell whether the running service matches
# the token currently in secrets.yml — without this, a rotated token never gets
# re-applied (the old gate only checked the unit file existed).
- name: Check if tunnel service installed
  ansible.builtin.stat:
    path: /etc/systemd/system/cloudflared.service
  register: cloudflared_svc

- name: Read installed tunnel unit
  ansible.builtin.slurp:
    src: /etc/systemd/system/cloudflared.service
  register: cloudflared_unit
  when: cloudflared_svc.stat.exists

- name: Determine whether the installed token matches secrets.yml
  ansible.builtin.set_fact:
    cloudflared_token_matches: >-
      {{ cloudflared_svc.stat.exists
         and cloudflare_tunnel_token in (cloudflared_unit.content | b64decode) }}

# Tear down a stale install so the reinstall below registers the new token.
- name: Uninstall stale tunnel service (token changed)
  ansible.builtin.command: cloudflared service uninstall
  changed_when: true
  when: cloudflared_svc.stat.exists and not cloudflared_token_matches

- name: Install tunnel as systemd service
  ansible.builtin.command: "cloudflared service install {{ cloudflare_tunnel_token }}"
  no_log: true
  changed_when: true
  when: not cloudflared_token_matches
  notify: Restart cloudflared

- name: Ensure cloudflared started
  ansible.builtin.systemd:
    name: cloudflared
    state: started
    enabled: true
    daemon_reload: true
