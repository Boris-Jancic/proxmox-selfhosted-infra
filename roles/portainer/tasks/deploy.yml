---
- name: Ensure portainer install directory
  file:
    path: "{{ portainer_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure portainer data directory
  file:
    path: "{{ portainer_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Bring portainer stack up
  command: docker compose up -d
  args:
    chdir: "{{ portainer_install_dir }}"
  register: compose_up
  changed_when: >
    'Started' in compose_up.stderr
    or 'Recreated' in compose_up.stderr
    or 'Created' in compose_up.stderr
