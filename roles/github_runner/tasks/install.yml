---
- name: Ensure runner user
  user:
    name: "{{ github_runner_user }}"
    system: true
    shell: /bin/bash
    home: "{{ github_runner_dir }}"
    create_home: false

- name: Ensure runner directory
  file:
    path: "{{ github_runner_dir }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0750"

- name: Download runner tarball
  get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-linux-x64-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_dir }}-{{ github_runner_version }}.tar.gz"
    checksum: "sha256:{{ github_runner_sha256 }}"
    mode: "0644"

- name: Unpack runner
  unarchive:
    src: "{{ github_runner_dir }}-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_dir }}"
    remote_src: true
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    creates: "{{ github_runner_dir }}/config.sh"
  register: runner_unpack

- name: Install runner OS dependencies
  command: ./bin/installdependencies.sh
  args:
    chdir: "{{ github_runner_dir }}"
  when: runner_unpack is changed
