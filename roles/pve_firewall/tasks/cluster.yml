---
# /etc/pve is pmxcfs: cluster-wide, so these are written once from the
# primary. pmxcfs only accepts 0640 on non-private files; no owner changes.
- name: Render datacenter firewall
  ansible.builtin.template:
    src: cluster.fw.j2
    dest: /etc/pve/firewall/cluster.fw
    mode: "0640"

- name: Render guest firewalls
  ansible.builtin.template:
    src: guest.fw.j2
    dest: "/etc/pve/firewall/{{ hostvars[guest].ctid | default(hostvars[guest].id) }}.fw"
    mode: "0640"
  loop: "{{ pve_fw_guests }}"
  loop_control:
    loop_var: guest
