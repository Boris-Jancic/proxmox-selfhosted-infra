---
- name: Check traefik binary
  stat:
    path: /usr/local/bin/traefik
  register: traefik_bin

- name: Download and extract traefik binary
  ansible.builtin.unarchive:
    src: "{{ traefik_binary_url }}"
    dest: /usr/local/bin
    remote_src: true
    include:
      - traefik
    mode: "0755"
  when: not traefik_bin.stat.exists

- name: Deploy traefik systemd unit
  template:
    src: traefik.service.j2
    dest: /etc/systemd/system/traefik.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable and start traefik
  systemd:
    name: traefik
    enabled: true
    state: started
    daemon_reload: true
