---
- name: Ensure config directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ traefik_config_dir }}"
    - "{{ traefik_dynamic_dir }}"

- name: Render static config
  template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart traefik

- name: Render dynamic route config
  template:
    src: dynamic.yml.j2
    dest: "{{ traefik_dynamic_dir }}/routes.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart traefik
