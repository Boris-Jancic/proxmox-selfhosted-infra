[defaults]
inventory = inventory.yml
# Every target (PVE nodes, Debian LXCs, Ubuntu VMs) has it; pinning silences
# the interpreter-discovery warning.
interpreter_python = /usr/bin/python3
roles_path = ./roles
stdout_callback = ansible.builtin.default
result_format = yaml
host_key_checking = False
retry_files_enabled = False

[ssh_connection]
pipelining = True
