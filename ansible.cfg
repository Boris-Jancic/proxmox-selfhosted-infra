[defaults]
inventory = inventory.yml
# Every target (PVE nodes, Debian LXCs, Ubuntu VMs) has it; pinning silences
# the interpreter-discovery warning.
interpreter_python = /usr/bin/python3
roles_path = ./roles
stdout_callback = ansible.builtin.default
result_format = yaml
host_key_checking = False
retry_files_enabled = False
# Gathered facts are cached as JSON so tools/cluster-mcp can serve them
# (ANSIBLE_FACT_CACHE). Gathering itself is unchanged.
fact_caching = jsonfile
fact_caching_connection = ~/.cache/ansible/facts
fact_caching_timeout = 604800

[ssh_connection]
pipelining = True
