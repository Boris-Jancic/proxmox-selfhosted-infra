---
name: cluster-mcp

on:
  push:
    paths:
      - tools/cluster-mcp/**
      - inventory.yml
      - group_vars/**
      - .github/workflows/cluster-mcp.yml
  pull_request:
    paths:
      - tools/cluster-mcp/**
      - inventory.yml
      - group_vars/**
      - .github/workflows/cluster-mcp.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/cluster-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/cluster-mcp/pyproject.toml

      - name: Install
        run: pip install -e '.[test]' ruff==0.16.9

      - name: ruff
        run: ruff check --output-format github . && ruff format --check .

      - name: pytest
        run: pytest -q
