---
# Non-secret defaults shared across plays.
# Companion file: group_vars/all/secrets.yml (gitignored, vaulted in prod).
# An example with the same variable names lives at secrets.yml.example.

# Proxmox API connection
proxmox_api_host: "127.0.0.1"
proxmox_api_port: 8006
proxmox_node: pve-brain

# Node a guest lives on. Defaults to proxmox_node; override per host in
# inventory.yml (e.g. `pve_node: pve-worker`). Node entries set it to themselves.
pve_node: "{{ proxmox_node }}"
# Inventory host to SSH to for node-local commands (qm/pct/pveam) on pve_node.
pve_node_host: >-
  {{ groups['proxmox_nodes'] | map('extract', hostvars)
     | selectattr('pve_node', 'equalto', pve_node)
     | map(attribute='inventory_hostname') | first }}

# PVE user — referenced by homepage widget template and embedded in token IDs below.
proxmox_api_user: "root@pam"

# Token label only (not the full "user@realm!tokenid" string — that's assembled
# by the module from api_user + api_token_id). Create in Proxmox GUI:
# Datacenter → Permissions → API Tokens → Add, user root@pam, token ID
# "ansible", privilege separation off. UUID secret → secrets.yml.
proxmox_api_token_id: "ansible"

# Separate token used only by the homepage widget, so the widget never holds the
# Ansible provisioning token above. Read-only: roles/proxmox_host turns on
# privilege separation and grants PVEAuditor on / (tag `tokens`).
# Create in Proxmox GUI: Datacenter → API Tokens → Add, user root@pam,
# token ID "homepage", privilege separation on.
proxmox_homepage_token_id: "homepage"

# LXC defaults
proxmox_template_vmid: 799
proxmox_storage: "data-hdd"
lxc_template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
lxc_storage: local-lvm
lxc_swap: 256

# Network
network_gateway: 192.168.88.1
network_prefix: "/24"

# Read controller's SSH public key from disk so it gets baked into new LXCs
# at create time. Override the path here if you use rsa or a different file.
controller_ssh_pubkey_path: "~/.ssh/id_ed25519.pub"
controller_ssh_pubkey: "{{ lookup('file', controller_ssh_pubkey_path) }}"

# Public DNS zone. Reused throughout inventory.yml — adding a vhost only
# needs the subdomain, e.g. `cloud.{{ cloudflare_zone }}`.
cloudflare_zone: "jancic.website"
