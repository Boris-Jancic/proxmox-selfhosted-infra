---
# Master playbook — provisions and configures the entire homelab.
# Individual playbooks remain runnable on their own; this only imports them in dependency order.
#
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --tags configure
#   ansible-playbook playbooks/site.yml --tags caddy

- import_playbook: provision-lxc.yml
  tags: [provision, lxc]

- import_playbook: provision-vms.yml
  tags: [provision, vms]

- import_playbook: configure-pihole.yml
  tags: [configure, pihole]

- import_playbook: configure-vaultwarden.yml
  tags: [configure, vaultwarden]

- import_playbook: configure-uptime-kuma.yml
  tags: [configure, uptime-kuma]

- import_playbook: configure-homepage.yml
  tags: [configure, homepage]

- import_playbook: configure-portainer.yml
  tags: [configure, portainer]

- import_playbook: configure-nextcloud.yml
  tags: [configure, nextcloud]

- import_playbook: configure-caddy.yml
  tags: [configure, caddy]
