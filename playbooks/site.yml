---
# Master playbook — provisions and configures the entire homelab.
# Individual playbooks remain runnable on their own; this only imports them in dependency order.
#
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --tags configure
#   ansible-playbook playbooks/site.yml --tags caddy

- name: Provision LXC containers
  ansible.builtin.import_playbook: provision-lxc.yml
  tags: [provision, lxc]

- name: Provision VMs
  ansible.builtin.import_playbook: provision-vms.yml
  tags: [provision, vms]

- name: Configure Proxmox nodes
  ansible.builtin.import_playbook: configure-proxmox-host.yml
  tags: [configure, proxmox-host]

- name: Configure Proxmox firewall
  ansible.builtin.import_playbook: configure-firewall.yml
  tags: [configure, firewall]

- name: Configure corosync QDevice
  ansible.builtin.import_playbook: configure-qdevice.yml
  tags: [configure, qdevice]

- name: Configure Pi-hole
  ansible.builtin.import_playbook: configure-pihole.yml
  tags: [configure, pihole]

- name: Configure Vaultwarden
  ansible.builtin.import_playbook: configure-vaultwarden.yml
  tags: [configure, vaultwarden]

- name: Configure Uptime Kuma
  ansible.builtin.import_playbook: configure-uptime-kuma.yml
  tags: [configure, uptime-kuma]

- name: Configure Homepage
  ansible.builtin.import_playbook: configure-homepage.yml
  tags: [configure, homepage]

- name: Configure Portainer
  ansible.builtin.import_playbook: configure-portainer.yml
  tags: [configure, portainer]

- name: Configure GitHub runner
  ansible.builtin.import_playbook: configure-github-runner.yml
  tags: [configure, github-runner]

- name: Configure Nextcloud AIO
  ansible.builtin.import_playbook: configure-nextcloud.yml
  tags: [configure, nextcloud]

- name: Configure Caddy
  ansible.builtin.import_playbook: configure-caddy.yml
  tags: [configure, caddy]
