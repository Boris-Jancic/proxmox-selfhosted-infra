---
# Iterates over VM inventory entries without connecting to them (they may not
# exist yet): the ubuntu role delegates API calls to localhost and qm commands
# to the VM's node. No play-level `connection: local` — it would also apply to
# the delegated tasks and run them on the controller instead of the node.
- name: Provision Ubuntu VMs via Proxmox API
  hosts: virtual_machines
  gather_facts: false
  roles:
    - ubuntu

- name: Wait for VMs to accept SSH connections
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait for SSH port on each VM
      wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        timeout: 300
        sleep: 5
      loop: "{{ groups['virtual_machines'] }}"
      loop_control:
        label: "{{ item }}"

- name: Base configuration for Ubuntu VMs
  hosts: virtual_machines
  gather_facts: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - qemu-guest-agent
          - curl
          - ca-certificates
          - gnupg
        state: present

    - name: Enable and start QEMU guest agent
      systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
